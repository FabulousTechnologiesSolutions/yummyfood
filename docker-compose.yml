services:
  web:
    build: .
    ports:
      - "6060:6060"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('127.0.0.1', 6060), timeout=2).close()\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    env_file:
      - .env
    environment:
      POSTGRES_DB: foodapp
      POSTGRES_USER: foodapp
      POSTGRES_PASSWORD: foodapp
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      - db
      - redis
    volumes:
      - .:/app
      - media_data:/app/media
      - log_data:/app/logs
  celery:
    build: .
    entrypoint: []
    command: celery -A conf worker -l info
    env_file:
      - .env
    environment:
      POSTGRES_DB: foodapp
      POSTGRES_USER: foodapp
      POSTGRES_PASSWORD: foodapp
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      FFMPEG_PATH: /usr/bin/ffmpeg
      FFPROBE_PATH: /usr/bin/ffprobe
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      web:
        condition: service_healthy
    volumes:
      - .:/app
      - media_data:/app/media
      - log_data:/app/logs
  celery-beat:
    build: .
    entrypoint: []
    command: celery -A conf beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file:
      - .env
    environment:
      POSTGRES_DB: foodapp
      POSTGRES_USER: foodapp
      POSTGRES_PASSWORD: foodapp
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      web:
        condition: service_healthy
      celery:
        condition: service_started
    volumes:
      - .:/app
      - media_data:/app/media
      - log_data:/app/logs
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: foodapp
      POSTGRES_USER: foodapp
      POSTGRES_PASSWORD: foodapp
    ports:
      - "5438:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6371:6379"
volumes:
  postgres_data:
  media_data:
  log_data:
